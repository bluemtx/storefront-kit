name: Release packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Pack packages
        run: |
          npm pack -w @bluemtx/storefront-sdk
          npm pack -w create-bluemtx-storefront
          npm pack -w create-bluemtx-extension
          ls -la *.tgz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npmjs
        run: |
          npm publish -w @bluemtx/storefront-sdk --access public
          npm publish -w create-bluemtx-storefront --access public
          npm publish -w create-bluemtx-extension --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
